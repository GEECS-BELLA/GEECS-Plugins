[tool.poetry]
name = "geecs-mcp"
version = "0.7.2"
description = "MCP server exposing GEECS scan submission, monitoring, and config discovery to AI agents (OSPREY)"
authors = ["Sam Barber <sbarber@lbl.gov>"]
readme = "README.md"
packages = [{ include = "geecs_mcp" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# The MCP framework — the same one osprey's native servers use (FastMCP,
# 2.x+; stdio transport by default), so the profile.yml integration is the
# house pattern verbatim.
fastmcp = ">=2.0"

# Imported directly (the to-thread tool dispatch) — declared, not ridden
# transitively via fastmcp (review finding).
anyio = ">=4.0"

# Figure downscaling (analysis domain) — imported directly, declared.
pillow = ">=10.0"

# analysis_status YAML parsing — imported directly, declared (the anyio
# lesson, applied to BOTH new direct imports this time).
pyyaml = ">=6.0"

# The queue client + pre-submit preflight (geecs_bluesky.qs_client) and the
# config resolver/listings.  qs-client pulls bluesky-queueserver-api; ca
# pulls aioca for the preflight's CONNECTED/staleness reads.  The package
# import is light (PEP 562) — the heavy stacks load only when tools run.
geecs-bluesky = { path = "../GeecsBluesky", develop = true, extras = ["qs-client", "ca"] }

# Completed-run lookup (get_scan_result): TiledScanCatalog over the archive.
geecs-data-utils = { path = "../GEECS-Data-Utils", develop = true, extras = ["tiled"] }

# The one submission shape (ScanRequest) — validation at the tool boundary.
geecs-schemas = { path = "../GEECS-Schemas", develop = true }

# On-demand ScanAnalysis execution (#686: run_scan_analysis + the
# analyzer/group listings) — heavy (scipy/opencv/scikit-image ride in via
# ImageAnalysis), so it is an extra mirroring GeecsBluesky's
# analysis/optimize pattern.  Without it the run/listing tools refuse with
# a clear message naming the extra; the server always starts.
scananalysis = { path = "../ScanAnalysis", develop = true, optional = true }

[tool.poetry.extras]
analysis-run = ["scananalysis"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
ruff = ">=0.9"
pydocstyle = ">=6.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
