[tool.poetry]
name = "geecs-mcp"
version = "0.10.1"
description = "MCP server for AI agents (OSPREY): a thin HTTP client of the GEECS web scanner, Data Portal and logbook"
authors = ["Sam Barber <sbarber@lbl.gov>"]
readme = "README.md"
packages = [{ include = "geecs_mcp" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# The MCP framework — the same one osprey's native servers use (FastMCP,
# 2.x+; stdio transport by default), so the profile.yml integration is the
# house pattern verbatim.
fastmcp = ">=2.0"

# Imported directly (the wait verbs' pauses) — declared, not ridden
# transitively via fastmcp.
anyio = ">=4.0"

# The HTTP client every tool speaks through: the scanner (:8300), the
# portal (:8200) and the logbook (:8400) are the only things this server
# talks to (DESIGN.md).  Async, one client per service.
httpx = ">=0.27"

# The one opt-in that moves image bytes through model context: the
# bounded thumbnail of a figure (get_scan_figure thumbnail=true).
pillow = ">=10.0"

# No intra-repo runtime dependency: this server imports nothing from the
# repo (the `mcp-is-a-client` import contract).  The three services it is a
# client of appear below as DEV deps only, for the in-process contract tests.

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"
ruff = ">=0.9"
pydocstyle = ">=6.3"
# The contract tests mount the services' own FastAPI apps in process behind
# an httpx ASGI transport, so a route or model change there fails this suite
# in the same PR (DESIGN.md §7).  Dev-only: nothing under geecs_mcp/ imports
# them.  The portal's `analysis` extra is what makes its analysis routes
# live (the catalog and the run listing need the analysis core installed;
# the runs themselves are driven through an injected fake factory).
geecs-scanner = { path = "../GeecsScanner", develop = true }
geecs-data-portal = { path = "../GEECS-DataPortal", develop = true, extras = ["analysis"] }
# The logbook: post_logbook_entry's create, and the portal's figure sends,
# land in one in-process logbook app.
geecs-logbook = { path = "../GeecsLogbook", develop = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
