version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # geecs-bluesky brings geecs-core (docs/geecs_core/api/client.md is an
    # mkdocstrings page) and geecs-data-utils in as path deps, resolved
    # relative to the checkout, same as the local docs env.
    - method: pip
      path: GeecsBluesky
    - method: pip
      path: ImageAnalysis
    - requirements: docs/requirements.txt
