version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # geecs-bluesky is importable for mkdocstrings pages that reach into
    # it; its intra-repo path deps resolve relative to the checkout, same
    # as the local docs env.
    - method: pip
      path: GeecsBluesky
    - method: pip
      path: ImageAnalysis
    - requirements: docs/requirements.txt
