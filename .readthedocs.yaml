version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # geecs-bluesky backs the mkdocstrings pages over geecs_bluesky.events
    # (docs/geecs_console/api/scan_events.md); its intra-repo path deps
    # resolve relative to the checkout, same as the local docs env.
    - method: pip
      path: GeecsBluesky
    - method: pip
      path: ImageAnalysis
    - requirements: docs/requirements.txt
