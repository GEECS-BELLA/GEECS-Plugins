<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEECS analysis config editor</title>
<link rel="stylesheet" href="static/editor.css">
<style>
  :root {
    --bg: #12161a; --panel: #1a2026; --panel2: #20272e; --line: #2c353d;
    --ink: #dde4ea; --dim: #8a95a0; --accent: #4cc2b4; --err: #cf5347;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 0.6rem 1.2rem; display: flex; gap: 1rem; align-items: baseline; }
  header .brand { font-weight: 600; color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; }
  main { padding: 0.8rem 1.2rem; }
  #editor { height: calc(100vh - 5rem); }
</style>
</head>
<body>
<header>
  <span class="brand">GEECS analysis configs</span>
  <span class="sub">{% if read_only %}read-only browser{% else %}editor — saves write the configs tree; commit them yourself{% endif %}</span>
</header>
<main>
  <div id="editor"></div>
</main>
<script src="static/editor.js"></script>
<script>
  // The API base is this page's own URL: works at "/" and under any mount.
  const BASE = location.pathname.replace(/\/$/, "");
  ConfigEditor.mount(document.getElementById("editor"), {
    base: BASE,
    preview: null,
    readOnly: {{ read_only | tojson }},
    layout: "page",
  });
</script>
</body>
</html>
