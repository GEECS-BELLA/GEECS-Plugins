[tool.poetry]
name = "scananalysis"
version = "1.27.0"
description = "Modules for performing analyses routines on full scans"
authors = ["Christopher Doss <CEDoss@lbl.gov>", "Sam Barber <sbarber@lbl.gov"]
readme = "README.md"
packages = [
    { include = "scan_analysis" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
ImageAnalysis = { path = "../ImageAnalysis", develop = true }
geecs-analysis = { path = "../GEECS-Analysis", develop = true }
# the config documents (AnalysisDiagnostic / AnalysisGroup / ScanRuntime) —
# pydantic-only, shared with ImageAnalysis, the portal and MCP
geecs-schemas = { path = "../GEECS-Schemas", develop = true }
geecs_data_utils = { path = "../GEECS-Data-Utils", develop = true }

pyyaml = "^6.0.2"
matplotlib = "^3.9.2"
pandas = "^2.2.3"
h5py = "^3.8.0"

# the web config editor (scan_analysis.config_editor) — optional: a router
# the data portal mounts at /configs (its one host since the standalone
# launcher was removed)
fastapi = { version = ">=0.110", optional = true }
jinja2 = { version = ">=3.1", optional = true }
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, optional = true }

[tool.poetry.extras]
editor = ["fastapi", "jinja2", "geecs-web-theme"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
httpx = ">=0.27"   # fastapi TestClient for the editor tests


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
