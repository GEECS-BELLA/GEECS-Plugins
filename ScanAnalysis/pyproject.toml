[tool.poetry]
name = "scananalysis"
version = "1.48.0"
description = "Modules for performing analyses routines on full scans"
authors = ["Christopher Doss <CEDoss@lbl.gov>", "Sam Barber <sbarber@lbl.gov"]
readme = "README.md"
packages = [
    { include = "scan_analysis" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
geecs-analysis = { path = "../GEECS-Analysis", develop = true }
# the config documents (AnalysisRecipe / AnalysisGroup / HimgJob) —
# pydantic-only, shared with the portal and MCP
geecs-schemas = { path = "../GEECS-Schemas", develop = true }
geecs_data_utils = { path = "../GEECS-Data-Utils", develop = true }

pyyaml = "^6.0.2"
matplotlib = "^3.9.2"
pandas = "^2.2.3"
h5py = "^3.8.0"


[tool.poetry.scripts]
# Check, prepare and self-test a host's WaveKit (HASO) install:
# config keys, share tree, Wine prefix, the vendor sample, the golden
# reference (scan_analysis.services.wavekit_doctor).
geecs-wavekit-doctor = "scan_analysis.services.wavekit_doctor:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
