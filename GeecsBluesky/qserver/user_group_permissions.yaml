user_groups:
  # Global baseline: allow every discovered plan, device, and function.
  root:
    allowed_plans:
      - null
    forbidden_plans:
      - null
    allowed_devices:
      - null
    forbidden_devices:
      - null
    allowed_functions:
      - null
    forbidden_functions:
      - null

  # Staff/admin group: regex-all access to plans, devices, and functions.
  admin:
    allowed_plans:
      - ":.*"
    forbidden_plans:
      - null
    allowed_devices:
      - ":?.*:depth=5"
    forbidden_devices:
      - null
    allowed_functions:
      - ":.*"
    forbidden_functions:
      - null

  # Operator group: queue submission is restricted to the plans the startup
  # profile registers (geecs_bluesky.plan_names.GEECS_PLAN_NAMES — the stock
  # scan verbs bound strict over the device namespace, plus mv for a manual
  # move and run_action for a named action plan;
  # tests/test_deploy_templates.py pins this line to that tuple); no
  # function execution (the function verbs went with the funnel, #807).
  operator:
    allowed_plans:
      - ":^(count|scan|rel_scan|list_scan|rel_list_scan|log_scan|rel_log_scan|grid_scan|rel_grid_scan|list_grid_scan|rel_list_grid_scan|spiral|rel_spiral|spiral_fermat|rel_spiral_fermat|spiral_square|rel_spiral_square|x2x_scan|mv|run_action)$"
    forbidden_plans:
      - null
    # Devices are nouns in the namespace (#807 phase 1): a plan argument may
    # name a device or a sub-device (``U_S1H``, ``U_S1H.Current``); depth 3
    # reaches a settable child's own children without exposing signal guts.
    allowed_devices:
      - ":?.*:depth=3"
    forbidden_devices:
      - null
    allowed_functions:
      - null
    forbidden_functions:
      - null

  # The `qserver` CLI submits as user group `primary` by default — without
  # this group EVERY CLI submission is rejected with "Unknown user group:
  # 'primary'" (empirical, issue #636). Admin-equivalent for now; production
  # tightens it to the `operator` shape.
  primary:
    allowed_plans:
      - ":.*"
    allowed_devices:
      - ":?.*:depth=5"
    allowed_functions:
      - ":.*"
