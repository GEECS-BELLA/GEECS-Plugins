# Run from this directory with the venv built from requirements.txt (+ pytest),
# which scripts/check.sh creates as tiled_server/.venv from the Poetry env's
# interpreter:
#   .venv/bin/pytest -q
# Its own ini so pytest's rootdir is here, not GeecsBluesky's (whose
# addopts and plugins belong to the Poetry env).
[pytest]
testpaths = tests
