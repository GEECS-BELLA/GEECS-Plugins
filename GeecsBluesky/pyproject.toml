[tool.poetry]
name = "geecs-bluesky"
version = "0.97.0"
description = "Bluesky / ophyd-async bridge for the GEECS control system"
authors = ["Sam Barber <sbarber@lbl.gov>"]
readme = "README.md"
packages = [{ include = "geecs_bluesky" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
# Track the current ophyd-async 0.19.x API (init_devices, ophyd_async.epics.core,
# observe_value) — kept consistent with the GeecsCAGateway env.  The solver can
# struggle with pydantic-numpy's multi-Python markers; see INSTALL.md for the
# pip-based bootstrap if `poetry install` fails.
ophyd-async = ">=0.19.3,<1.0"
bluesky = ">=1.12"

# Scan numbering (claim_scan_number) and the Tiled→s-file exporter
# (write_scalar_files_from_tiled) live here; it also supplies pandas/nptdms
# transitively, so they are not pinned separately above.
geecs_data_utils = { path = "../GEECS-Data-Utils", develop = true }
# optimize-extra only (the evaluators' load_diagnostic); nothing in the core
# engine imports ImageAnalysis, and no separate extra installs it alone.
imageanalysis = { path = "../ImageAnalysis", develop = true, optional = true }

# The GEECS access library: GeecsDb metadata, pv_naming, and the
# wire-level exception tree. The CA gateway itself is consumed only as a
# service (its PVs, over aioca) — this package imports no gateway code.
geecs-core = { path = "../GEECS-Core", develop = true }

# The schema layer: ScanRequest + the config models and
# legacy-YAML converters consumed by scan_request_runner / session.run().
# Pydantic-only — deliberately lightweight.
geecs-schemas = { path = "../GEECS-Schemas", develop = true }

tiled = {version = ">=0.2", extras = ["client"], optional = true}

# CA client for the ophyd-async CA backend (devices/ca/*), which consumes the
# GeecsCAGateway PVs like any EPICS IOC.  Optional: only the `ca` device backend
# needs it; the direct UDP/TCP backend does not.  aioca bundles libca via
# epicscorelibs, so no system EPICS base is required.
aioca = { version = ">=1.7", optional = true }

# Native optimization: live ImageAnalysis measurements and Xopt ask/tell.
# Heavy numerical dependencies install on the worker via the optimize extra.
xopt = { version = "^3.1", optional = true }
gest-api = { version = ">=0.1,<0.2", optional = true }

# torch arrives transitively (xopt -> botorch -> torch), and PyPI's default
# Linux wheel is the CUDA build: it drags fifteen nvidia-* packages plus
# triton, none of which is ever loaded without an NVIDIA GPU. Neither the
# worker nor a CI runner has one. Declared directly here — the only way to
# pin a transitive package's source — against PyTorch's CPU index, which
# carries every platform this repo runs on (manylinux_2_28_x86_64, macOS
# arm64, win_amd64). Measured: the download set for this package's CI leg
# was 8.4 GB with the CUDA build, against GitHub's 10 GB cache cap.
#
# If a GPU box ever runs the optimizer, drop the `source` key here and
# relock — nothing else changes, and the optimize tests are identical
# either way (they exercise ask/tell and the measurement compiler, not
# GPU maths).
# Split by platform because the +cpu index carries no macOS wheels for
# current versions — macOS torch is CPU-only on PyPI already (there is no
# CUDA build for it), so a developer's Mac resolves from PyPI exactly as
# before. Only Linux, where the default wheel is the CUDA one, is
# redirected. Verified: a single-source form locked with zero macOS
# wheels, which would have broken `--extras optimize` on a Mac.
# Split by platform. The +cpu index publishes Linux wheels as
# "X.Y.Z+cpu" but macOS wheels as plain "X.Y.Z", and a lock entry holds ONE
# version — so a single source at <2.11 locked 2.10.0+cpu and broke macOS
# outright (`poetry install --extras optimize` exits 1, "38 wheel(s) were
# skipped as your project's environment does not support the identified abi
# tags"). macOS torch on PyPI is CPU-only anyway (there is no CUDA build for
# it), so only Linux needs redirecting.
torch = [
    { version = ">=2.4", source = "pytorch-cpu", markers = "platform_system == 'Linux'", optional = true },
    { version = ">=2.4", markers = "platform_system != 'Linux'", optional = true },
]

# The queueserver worker (GeecsBluesky/qserver/) — RE Manager itself, not a
# runtime import of geecs_bluesky. Pinned to the release validated by the
# 2026-08-20 RE Manager sandbox spike (operational contract: qserver/README.md
# Troubleshooting).
bluesky-queueserver = { version = "^0.0.25", optional = true }

# The client side of the queue (geecs_bluesky/qs_client/ — extracted from
# GEECS-Console 2026-08-21): queue submission, status polling, and the
# manual function verbs for ANY manager client (the web scanner, notebooks, the
# GEECS MCP (OSPREY)). The api package itself is small, but it requires
# bluesky-queueserver and thereby a heavy transitive closure (ipykernel,
# jupyter-client, ophyd, redis, …) — do NOT treat this extra as a light
# add. Optional so the worker and headless installs don't carry it.
bluesky-queueserver-api = { version = "^0.0.13", optional = true }

# PVA client for the ophyd-async PVA backend: the file plugin's PVs on the
# camera servers (GeecsPvaGateway, #806 — a network service, no gateway code
# imported).  Rides the `ca` extra beside aioca: the extra is "the gateway
# clients", and the worker needs both.
p4p = { version = ">=4.1", optional = true }

# priority = "explicit": used ONLY by packages that name it (torch, above).
# Every other dependency continues to resolve from PyPI as before.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.extras]
tiled = ["tiled"]
ca = ["aioca", "p4p"]
optimize = ["xopt", "gest-api", "imageanalysis", "torch"]
qserver = ["bluesky-queueserver"]
qs-client = ["bluesky-queueserver-api"]

[tool.poetry.scripts]
# The service-start readiness assertion (#793): the geecs-qserver-ready
# oneshot unit runs it after the manager; needs only the qserver extra.
geecs-qserver-ensure-ready = "geecs_bluesky.qserver_ready:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"
pytest-timeout = "^2.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default run = the hermetic FakeGeecsServer unit tests under tests/ only, so a
# fresh checkout is green with NO lab network and NO live-device access. The
# top-level test_bluesky_scanner.py / test_hardware.py are manual hardware
# scripts (they drive real scans) and are deliberately excluded from default
# collection — run them explicitly, e.g. `poetry run python test_hardware.py`.
# The marker filter additionally skips the DB-touching integration tests.
testpaths = ["tests"]
addopts = "-m 'not hardware and not integration'"
markers = [
    "integration: tests that touch external lab services such as the GEECS database",
    "hardware: tests that require live GEECS devices",
    "fake_server: tests that use local FakeGeecsServer TCP/UDP sockets",
]
