[tool.poetry]
name = "geecs-control-room"
version = "0.1.0"
description = "The operator surfaces over Canopy: the Control Room home and the screens renderer (a control GUI is a screen file drawn by one renderer)"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_control_room" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
pydantic = ">=2.7"
pyyaml = ">=6.0"
# The module client: GeecsCanopy's /geecs routes, over HTTP. Canopy and
# geecs-canopy are services here, never dependencies.
httpx = ">=0.27"
# A camera's frame URL and its plots' arrays, read over Channel Access by this
# server (images.py): read only, at the PVs the module names; never a write.
aioca = ">=1.7"
# The screen document, the family files and the panel data.
geecs-schemas = { path = "../GEECS-Schemas", develop = true }
# The kit and the FastAPI glue every surface shares. Imported, never copied.
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, extras = ["web"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
# The theme's CSS helpers for the template guards (the form GeecsWebTheme's
# CHANGELOG 0.6.0 prescribes: the runtime dependency re-declared).
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, extras = ["testing"] }
# The contract test drives GeecsCanopy's own module (its routes, its test
# doubles in geecs_canopy.testing) in process, so a route or field change there
# fails this suite in the same PR. Dev-only: geecs_control_room never imports
# it (the control-room-edges contract); Canopy itself is not installed.
geecs-canopy = { path = "../GeecsCanopy", develop = true }

[tool.poetry.scripts]
geecs-control-room = "geecs_control_room.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
