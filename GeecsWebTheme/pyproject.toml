[tool.poetry]
name = "geecs-web-theme"
version = "0.5.0"
description = "One palette vocabulary for every GEECS web surface: tokens, themes, and the picker"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_web_theme" }]
include = ["geecs_web_theme/static/*"]

[tool.poetry.dependencies]
# No runtime dependencies without an extra, on purpose. This package is a
# stylesheet, a small script and a path helper — anything that can serve a
# static file can use it, and nothing it serves needs a Python import to work.
python = ">=3.11,<3.12"
# The `web` extra: geecs_web_theme.web — the forwarded-prefix middleware, the
# /theme mount and the templates factory every FastAPI surface shares. Opt-in
# so the static-only use stays dependency-free.
fastapi = { version = ">=0.110", optional = true }
jinja2 = { version = ">=3.1", optional = true }
# The `testing` extra: the CSS guards in geecs_web_theme.testing read
# stylesheets through a real parser. A consumer's test suite that uses
# them (the "every class on the page is styled" check) takes this extra
# in its dev group; the HTML guards need nothing.
tinycss2 = { version = ">=1.3", optional = true }

[tool.poetry.extras]
web = ["fastapi", "jinja2"]
testing = ["tinycss2"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
# tests/test_web.py exercises the `web` extra end to end.
fastapi = ">=0.110"
jinja2 = ">=3.1"
httpx = ">=0.27"
tinycss2 = ">=1.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
