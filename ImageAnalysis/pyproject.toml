[tool.poetry]
name = "imageanalysis"
version = "1.14.1"
description = "Central sub-repository for online and offline analysis of BELLA exeriments' images."
authors = ["Reinier van Mourik <reinier.vanmourik@tausystems.com>"]
readme = "README.md"
packages = [{include = "image_analysis"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# numeric libraries (Python 3.7-3.10 / numpy 1.x support was dropped; the
# analyzers use numpy 2.0+ APIs such as np.trapezoid, and the integrated
# monorepo environment is Python 3.11)
numpy = ">=2.0,<3.0"
scipy = ">=1.11,<2.0"
pandas = "^2.2.3"
Pint = ">=0.24,<=0.28"

pyabel = ">=0.9.1,<1.0"

# image libraries
pypng = "^0.20220715.0"
imageio = "^2.31.1"
scikit-image = ">=0.19,<1.0"

# rendering — imported at module top level by the runtime analyzers
# (StandardAnalyzer, BeamAnalyzer, Standard1DAnalyzer, tools/rendering, ...),
# so it is a main dependency, not a dev one (#752)
matplotlib = "^3.0"

# other
opencv-python = "^4.9.0.80"

geecs-data-utils = { path = "../GEECS-Data-Utils", develop=true }


[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
h5py = "*"   # tests only (tests/test_shotref_loading.py writes an HDF5 fixture)

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
