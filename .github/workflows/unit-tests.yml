name: unit-tests

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install root dependencies
        run: poetry install --with dev

      - name: Run root unit tests
        # One pytest process per testpath: the subpackages' identically-named
        # tests/ trees (tests.conftest) collide when collected in a single
        # process under pytest >= 8, whose importlib import mode resolves
        # real dotted module names first. Per-package runs are the normal
        # mode everywhere else; this mirrors them.
        run: |
          # Root tests/ is currently all integration-marked, so selecting
          # nothing is legitimate there: tolerate pytest's no-tests-collected
          # exit code (5) on that line only.
          poetry run pytest tests -m "not integration and not gui" --tb=short -q || [ $? -eq 5 ]
          poetry run pytest ImageAnalysis/tests -m "not integration and not gui" --tb=short -q
          poetry run pytest ScanAnalysis/tests -m "not integration and not gui" --tb=short -q
          poetry run pytest GEECS-Data-Utils/tests -m "not integration and not gui" --tb=short -q
          poetry run pytest GEECS-Schemas/tests -m "not integration and not gui" --tb=short -q

      - name: Install GeecsWebTheme dependencies
        working-directory: GeecsWebTheme
        run: poetry install --with dev

      # Guards the whole repo's web surfaces, not just this package: it walks
      # the portal's and the editor's templates too, so a colour literal added
      # anywhere fails here.
      - name: Run GeecsWebTheme tests
        working-directory: GeecsWebTheme
        run: poetry run pytest tests --tb=short -q

      - name: Install GeecsLogbook dependencies
        working-directory: GeecsLogbook
        run: poetry install --with dev

      - name: Run GeecsLogbook tests
        working-directory: GeecsLogbook
        run: poetry run pytest tests --tb=short -q

      - name: Install GeecsScanner dependencies
        working-directory: GeecsScanner
        run: poetry install --with dev

      - name: Run GeecsScanner tests
        working-directory: GeecsScanner
        run: poetry run pytest tests --tb=short -q

      - name: Install GEECS-DataPortal dependencies
        working-directory: GEECS-DataPortal
        # --extras analysis: the Images tab's processing-selector tests
        # (TestProcessingSelector) importorskip image_analysis and would
        # silently skip without it (the #737 CI-red lesson, 2026-09-01).
        run: poetry install --with dev --extras analysis

      - name: Run GEECS-DataPortal tests
        working-directory: GEECS-DataPortal
        run: poetry run pytest tests --tb=short -q

      - name: Install GEECS-Core dependencies
        working-directory: GEECS-Core
        run: poetry install --with dev

      - name: Run GEECS-Core tests
        working-directory: GEECS-Core
        run: poetry run pytest tests --tb=short -q

      - name: Install GeecsCAGateway dependencies
        working-directory: GeecsCAGateway
        run: poetry install --with dev

      - name: Run GeecsCAGateway tests
        # This suite previously ran only locally via scripts/check.sh — the
        # geecs-core extraction is the moment it (and the new GEECS-Core
        # suite above) joined CI, keeping check.sh's runner table and this
        # workflow in sync.
        working-directory: GeecsCAGateway
        run: poetry run pytest tests --tb=short -q

      - name: Install GeecsBluesky dependencies
        working-directory: GeecsBluesky
        # --extras qserver: the queueserver manager-validation pin test
        # (test_qserver_startup.py) importorskips bluesky_queueserver and
        # would silently skip without it (review finding, 2026-08-21).
        # --extras qs-client: tests/qs_client/test_queue_client.py
        # importorskips bluesky_queueserver_api the same way.
        # --extras ca: the mock-CA layer — every module behind
        # importorskip("aioca"), i.e. the device, shot-control, session, and
        # plan tests — skipped wholesale without it, so a green check said
        # nothing about that code (#866). aioca ships wheels (epicscorelibs
        # bundles libca), no system EPICS needed.
        run: poetry install --with dev --extras qserver --extras qs-client --extras ca

      - name: Run GeecsBluesky pure unit tests
        working-directory: GeecsBluesky
        # The -m expression REPLACES pyproject's addopts marker filter, so
        # `not hardware` must be spelled here: with the ca extra installed,
        # importorskip("aioca") no longer keeps hardware-marked modules out.
        # `shell: bash` runs with `-eo pipefail`, so the tee cannot mask
        # pytest's exit code. -rs lists every skip with its reason; the grep
        # turns an importorskip("aioca"/"p4p") skip — the extra missing or
        # broken on the runner — into a failure instead of a silent skip.
        # scripts/check.sh's GeecsBluesky runner mirrors this step.
        shell: bash
        run: |
          poetry run pytest tests -m "not integration and not fake_server and not hardware" --tb=short -q -rs | tee pytest-report.txt
          if grep -E "could not import '(aioca|p4p)'" pytest-report.txt; then
            echo "::error::GeecsBluesky's mock-CA tests skipped: the ca extra is missing or broken on the runner (#866)"
            exit 1
          fi

      - name: Install GEECS-MCP dependencies
        working-directory: GEECS-MCP
        # analysis-run: the #686 execution-slice tests importorskip
        # without it — install it so CI actually runs them.
        run: poetry install --with dev -E analysis-run

      - name: Run GEECS-MCP tests
        working-directory: GEECS-MCP
        run: poetry run pytest tests --tb=short -q

      - name: Install GeecsPvaGateway dependencies
        working-directory: GeecsPvaGateway
        run: poetry install --with dev

      - name: Run GeecsPvaGateway tests
        working-directory: GeecsPvaGateway
        run: poetry run pytest tests --tb=short -q
