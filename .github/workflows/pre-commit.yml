name: pre-commit

# Selective triggers for the same reason as unit-tests.yml: with both
# events unfiltered, every branch push ran this twice at the same SHA.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: pre-commit-${{ github.ref }}
  # Never cancel a master run: that exhaustive run is the backstop the
  # PR-side narrowing depends on, and two merges in quick succession would
  # otherwise cancel the first one's full matrix.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        # nbconvert provides the `jupyter nbconvert` the local
        # notebook-clear-output hook (language: system) shells out to.
        run: pip install pre-commit nbconvert

      - name: Run pre-commit on changed files
        env:
          # no-commit-to-branch guards LOCAL commits on master; in CI the
          # checkout IS master on every merge, so the hook failed every
          # master run and the backstop read red. CI never commits: skip it.
          SKIP: no-commit-to-branch
        run: |
          FROM_REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "$FROM_REF" ]; then
            FROM_REF="${{ github.event.before }}"
          fi
          # First push of a new branch has a null SHA for before — fall back to merge-base with default branch.
          if [ "$FROM_REF" = "0000000000000000000000000000000000000000" ]; then
            FROM_REF=$(git merge-base HEAD origin/master 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD^)
          fi
          # Force-push to a stacked PR (or any rewritten history) leaves $FROM_REF orphaned
          # on the remote — fetch-depth: 0 doesn't help because the SHA itself is gone.
          # Fall back to merge-base when $FROM_REF isn't reachable in the local clone.
          if ! git cat-file -e "${FROM_REF}^{commit}" 2>/dev/null; then
            FROM_REF=$(git merge-base HEAD origin/master 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD^)
          fi
          pre-commit run --from-ref "$FROM_REF" --to-ref "${{ github.sha }}" --show-diff-on-failure --color always

  # Pyright (basic) over the [tool.pyright] include set in the root
  # pyproject — GEECS-Core, GEECS-Schemas and the two gateways. On every PR,
  # unselected: the run is under a minute. The full root env is not needed:
  # extraPaths resolve the repo's own packages from source, so only the
  # leaves' third-party imports are installed, at the root lock's versions
  # (the same pins `poetry run pyright` sees locally via scripts/check.sh).
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyright and the leaves' third-party deps (root lock pins)
        run: |
          python - <<'PY' > pyright-requirements.txt
          import tomllib
          want = {"pyright", "pydantic", "mysql-connector-python", "gest-api",
                  "caproto", "pyyaml", "p4p", "numpy", "h5py"}
          with open("poetry.lock", "rb") as fh:
              lock = tomllib.load(fh)
          pins = {p["name"]: p["version"] for p in lock["package"] if p["name"] in want}
          missing = want - pins.keys()
          assert not missing, f"not in the root poetry.lock: {sorted(missing)}"
          print("\n".join(f"{name}=={version}" for name, version in sorted(pins.items())))
          PY
          pip install -r pyright-requirements.txt

      - name: Run pyright
        run: pyright
