exclude: |
  (?x)^(
    extras/|
    .*/third_party_sdks/|
    .*/image_analysis/algorithms/(grenouille|qwlsi)\.py$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
        stages: [pre-commit]
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: "(^extras/|.*/third_party_sdks/|.*\\.in$)"
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
        exclude: "(^extras/|.*/third_party_sdks/|.*_ui\\.py$|.*/tests/)"
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
        # The portal's vendored, version-pinned JS assets (owner-approved
        # doctrine amendment 2026-08-30 — see GEECS-DataPortal/CLAUDE.md)
        # are the one sanctioned class of >1MB blobs.
        exclude: "^GEECS-DataPortal/geecs_portal/static/"
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi, jupyter]
        exclude: "(^extras/|.*/third_party_sdks/|.*_ui\\.py$)"
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: "(^extras/|.*/third_party_sdks/|.*_ui\\.py$)"

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        additional_dependencies: [tomli]
        args: [--convention=numpy, --add-ignore=D401,D200,D400]
        # Legacy trees exempt until their proper audit/cleanup (owner
        # decision on PR #574, 2026-07-16). Also excludes stray
        # .ipynb_checkpoints and top-level tests/ (the .*/tests/ pattern
        # only matches nested tests dirs).
        exclude: |
          (?x)^(
            extras/|
            .*/third_party_sdks/|
            .*_ui\.py$|
            .*/tests/|
            tests/|
            .*/\.ipynb_checkpoints/|
            LogMaker4GoogleDocs/
          )

  - repo: local
    hooks:
      # A lock generated from inside a session worktree records that
      # worktree's absolute path in the geecs-bluesky extras lines and
      # dangles when the worktree is removed — always run `poetry lock`
      # from the main checkout (PR #690 finding 6).
      - id: poetry-lock-no-worktree-paths
        name: poetry.lock free of session-worktree paths
        language: pygrep
        entry: '\.claude/worktrees/'
        files: poetry\.lock$
      - id: jupyter-notebook-clear-output
        name: jupyter-notebook-jupyter-clear
        files: \.ipynb$
        stages: [pre-commit]
        language: system
        entry: jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace
        exclude: '(^extras/|.*/third_party_sdks/|^docs/).*\.ipynb$'
