[tool.poetry]
name = "geecs-data-portal"
version = "0.33.0"
description = "Scan-browsing web service (read-only except explicit analysis runs): a zero-install browser view over the Tiled catalog and the GEECS data share"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_portal" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
matplotlib = ">=3.8"
pillow = ">=10"
geecs-data-utils = { path = "../GEECS-Data-Utils", develop = true, extras = ["tiled"] }
geecs-web-theme = { path = "../GeecsWebTheme", develop = true }
plotly = "^7.0"
# Server-to-server only: the one call out of this process, to the
# logbook's own API (geecs_portal.logbook_send).  It was already here
# as a dev dependency — TestClient rides on it — and is now needed at
# run time too.
httpx = ">=0.27"
imageanalysis = { path = "../ImageAnalysis", develop = true, optional = true }
geecs-analysis = { path = "../GEECS-Analysis", develop = true, optional = true }
scananalysis = { path = "../ScanAnalysis", develop = true, optional = true }

[tool.poetry.extras]
# The Images tab's core processing and legacy fallback
# AND the Analysis tab's runs (ScanAnalysis executed directly);
# without it the portal serves raw images, the selector stays
# hidden and the run endpoints 404.
analysis = ["geecs-analysis", "imageanalysis", "scananalysis"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
geecs-data-portal = "geecs_portal.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
