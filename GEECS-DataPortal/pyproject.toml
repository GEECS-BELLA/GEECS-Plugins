[tool.poetry]
name = "geecs-data-portal"
version = "0.10.0"
description = "Read-only scan-browsing web service: a zero-install browser view over the Tiled catalog and the GEECS data share"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_portal" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
matplotlib = ">=3.8"
pillow = ">=10"
geecs-data-utils = { path = "../GEECS-Data-Utils", develop = true, extras = ["tiled"] }
plotly = "^7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[tool.poetry.scripts]
geecs-data-portal = "geecs_portal.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
