[tool.poetry]
name = "geecs-data-portal"
version = "0.43.0"
description = "Scan-browsing web service (read-only except explicit analysis runs): a zero-install browser view over the Tiled catalog and the GEECS data share"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_portal" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
matplotlib = ">=3.8"
pillow = ">=10"
geecs-data-utils = { path = "../GEECS-Data-Utils", develop = true, extras = ["tiled"] }
geecs-web-theme = { path = "../GeecsWebTheme", develop = true }
plotly = "^7.0"
# Server-to-server only: the one call out of this process, to the
# logbook's own API (geecs_portal.logbook_send).  It was already here
# as a dev dependency — TestClient rides on it — and is now needed at
# run time too.
httpx = ">=0.27"
# The plotter's numerics (the Fit menu, the image clean-ups) are
# GEECS-Analysis's, imported when the plot pages load: a hard edge.
geecs-analysis = { path = "../GEECS-Analysis", develop = true }
# Imported directly (the analysis documents in processing.py and app.py):
# declared, not ridden transitively via GEECS-Analysis.
geecs-schemas = { path = "../GEECS-Schemas", develop = true }
scananalysis = { path = "../ScanAnalysis", develop = true, optional = true }

[tool.poetry.extras]
# The Images tab's processing selector (ScanAnalysis' preview over the
# analysis core) AND the Analysis tab's runs (ScanAnalysis executed
# directly); without it the portal serves raw images and the plot
# pages, the selector stays hidden and the run endpoints 404.
analysis = ["scananalysis"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

# The contract tests mount the peers' own FastAPI apps in process (the
# analysis worker's for the day page's batch routes, the logbook's for the
# plot send), so a route or model change there fails this suite in the
# same PR. An optional group, so a service host's plain `poetry install`
# never installs them; CI and scripts/check.sh install it (`--with
# dev,contract`). geecs_portal never imports them (the portal-edges
# contract); both stay services reached over HTTP.
[tool.poetry.group.contract]
optional = true

[tool.poetry.group.contract.dependencies]
geecs-analysis-worker = { path = "../GeecsAnalysisWorker", develop = true }
geecs-logbook = { path = "../GeecsLogbook", develop = true }

[tool.poetry.scripts]
geecs-data-portal = "geecs_portal.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
