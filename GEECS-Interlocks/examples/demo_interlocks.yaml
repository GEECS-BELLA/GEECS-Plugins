# Demo interlocks for `geecs-interlocks serve --fake-devices`.
# The device names are made up: the demo scripts their values, sends the
# external signal's UDP packets itself, and moves the windmill's settings
# now and then, so every state (OK, TRIPPED, settling, waiting, a NaN, a
# dropout, a warning packet, a changed setting) shows up within a couple of
# minutes. Pass --arm-at-start to arm the windmill's settings.
schema_version: 1
stale_after_s: 5
interlocks:
  - name: chamber vacuum
    description: Main chamber pressure below the HV limit
    conditions:
      - kind: threshold
        device: DEMO_VacuumGauge
        variable: Pressure
        operator: ">"
        limit: 1.0e-5
        hysteresis: 1.0e-6
    settle_s: 3
  - name: pointing camera
    description: Not saturated, and the centroid on its reference (one group)
    conditions:
      - kind: threshold
        device: DEMO_PointingCam
        variable: MaxCounts
        operator: ">="
        limit: 4000
      - kind: alignment
        device: DEMO_PointingCam
        variable: CentroidX
        target_variable: TargetX
        tolerance: 20
        hysteresis: 5
    settle_s: 2
  - name: gauge alive
    conditions:
      - kind: stale
        device: DEMO_VacuumGauge
        max_age_s: 2
  - name: chiller connected
    conditions:
      - kind: stale
        device: DEMO_Chiller
  - name: stage motion
    description: The stage controller's UDP packets (one per change)
    conditions:
      - kind: external
        port: 5050
        source: stage controller
  - name: windmill settings
    description: Position and speed held at their armed values
    conditions:
      - kind: config_change
        device: DEMO_Windmill
        variables: [Position, Speed]
  - name: spare (disabled)
    enabled: false
    conditions:
      - kind: threshold
        device: DEMO_Chiller
        variable: Temperature
        operator: ">"
        limit: 30
