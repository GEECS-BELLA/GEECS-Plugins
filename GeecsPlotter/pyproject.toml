[tool.poetry]
name = "geecs-plotter"
version = "0.1.0"
description = "GEECSplotter as a web app: open a scan's s-file and plot one column against another"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_plotter" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
pydantic = ">=2.7"
pandas = ">=2.1.1,<3.0"
# The portal's pin: the vendored plotly.js bundle in static/ must draw what
# plotly.py serializes.
plotly = "^7.0"
# Colour maps for the camera images (geecs_data_utils.io.display_png imports
# it lazily; without it every image is greyscale).
matplotlib = ">=3.8"
# The s-file readers, column rules and (from M2) the binning and filters.
# Installed WITHOUT the tiled extra: nothing here needs Tiled.
geecs-data-utils = { path = "../GEECS-Data-Utils", develop = true }
# The theme and the kit, mounted at /theme by this process, and behind the
# `web` extra the FastAPI glue every surface shares. Imported, never copied.
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, extras = ["web"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[tool.poetry.scripts]
geecs-plotter = "geecs_plotter.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
