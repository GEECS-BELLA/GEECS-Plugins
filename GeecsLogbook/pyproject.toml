[tool.poetry]
name = "geecs-logbook"
version = "0.10.1"
description = "Scan logbook: a day-document view over scan folders, with human commentary stored beside the data"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_logbook" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
pydantic = ">=2.7"
# Rendering entries. markdown-it-py is CommonMark-compliant with a plugin
# architecture (tables, strikethrough, footnotes); nh3 sanitizes the output,
# which matters because an agent writes into the same field a human does.
markdown-it-py = ">=3.0"
mdit-py-plugins = ">=0.4"
nh3 = ">=0.2"
python-multipart = ">=0.0.9"
geecs-data-utils = { path = "../GEECS-Data-Utils", develop = true }
geecs-schemas = { path = "../GEECS-Schemas", develop = true }
# The theme and the kit, mounted at /theme by THIS process (the logbook is
# its own service since 0.10.0) — and, behind the `web` extra, the FastAPI
# glue every surface shares: the forwarded-prefix middleware, the /theme
# mount and the templates factory that puts `root` in every context.
# Imported, never copied.
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, extras = ["web"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"
# tests/test_seed_templates.py reads scanlog.css through the theme's
# parser-based guards (geecs_web_theme.testing): the same path dependency
# again, with the `testing` extra (tinycss2) for the dev group only.
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, extras = ["testing"] }

[tool.poetry.scripts]
geecs-logbook = "geecs_logbook.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
