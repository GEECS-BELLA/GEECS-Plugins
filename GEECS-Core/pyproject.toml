[tool.poetry]
name = "geecs-core"
version = "0.1.0"
description = "The GEECS access library: UDP/TCP wire protocol, experiment database, PV naming contract, and the entry-level GeecsDevice client"
authors = ["Sam Barber <sbarber@lbl.gov>"]
readme = "README.md"
packages = [{ include = "geecs_core" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
# Deliberately thin (see DESIGN.md): transport/ and the contracts are
# stdlib-only; db/ needs pydantic (AlarmLimits model) and mysql-connector
# (imported lazily — the package imports fine without lab access).
pydantic = ">=2"
mysql-connector-python = "^9.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"
pytest-timeout = "^2.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default run needs no lab network; the DB integration tests are opt-in.
addopts = "-m 'not integration'"
markers = [
    "fake_server: tests that use local FakeGeecsServer TCP/UDP sockets",
    "integration: tests that touch external lab services such as the GEECS database",
]
