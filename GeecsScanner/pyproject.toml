[tool.poetry]
name = "geecs-scanner"
version = "0.4.0"
description = "The web scanner console: submit, watch and stop GEECS scans from a browser — a FastAPI service over the queueserver client"
authors = ["GEECS-BELLA"]
readme = "README.md"
packages = [{ include = "geecs_scanner" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
pydantic = ">=2.7"
# The queue client, the preset expansion, the pre-submit preflight and the
# configs resolver.  qs-client pulls bluesky-queueserver-api (the 0MQ
# manager client); ca pulls aioca for the preflight's CONNECTED reads.  The
# package import is light — the heavy stacks load when verbs run.
geecs-bluesky = { path = "../GeecsBluesky", develop = true, extras = ["qs-client", "ca"] }
# The Preset (the one submission document), ScanVariables (the catalog the
# variable picker lists, pseudo entries included), SubmissionRecord.
geecs-schemas = { path = "../GEECS-Schemas", develop = true }
# The kit and the palettes, mounted at /theme by this process so the page
# and the reference page are served from the same origin — and, behind the
# `web` extra, the FastAPI glue every surface shares (the forwarded-prefix
# middleware, the /theme mount, the templates factory with `root`) plus the
# template guards `tests/test_page.py` runs.  Imported, never copied.
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, extras = ["web"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"
# The theme's CSS helpers (tinycss2) for the "every class is styled" guard:
# the runtime dependency above re-declared with the `testing` extra, the
# form GeecsWebTheme's CHANGELOG 0.6.0 prescribes — one floor, one owner.
geecs-web-theme = { path = "../GeecsWebTheme", develop = true, extras = ["testing"] }

[tool.poetry.scripts]
geecs-scanner = "geecs_scanner.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
