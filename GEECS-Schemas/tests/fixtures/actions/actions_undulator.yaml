schema_version: 1
plans:
  Amp4_DUMP_HP:
    schema_version: 1
    steps:
    - do: run
      plan: close_gaia_internal_shutters
    - do: set
      device: U_148_PLC
      variable: DO.Ch9
      value: 'off'
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: check
      device: U_148_PLC
      variable: DI.Ch17
      expected: 'off'
    - do: run
      plan: open_gaia_internal_shutters
    description: ''
  Amp4_SEND_HP_TO_TARGET:
    schema_version: 1
    steps:
    - do: run
      plan: close_gaia_internal_shutters
    - do: set
      device: U_148_PLC
      variable: DO.Ch9
      value: 'on'
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: check
      device: U_148_PLC
      variable: DI.Ch18
      expected: 'off'
    - do: run
      plan: open_gaia_internal_shutters
    description: ''
  close_gaia_internal_shutters:
    schema_version: 1
    steps:
    - do: set
      device: U_GaiaSVEReader
      variable: InternalShutterA
      value: 0
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: set
      device: U_GaiaSVEReader
      variable: InternalShutterB
      value: 0
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: check
      device: U_GaiaSVEReader
      variable: InternalShutterA
      expected: 0
    - do: wait
      seconds: 3.0
    - do: check
      device: U_GaiaSVEReader
      variable: InternalShutterB
      expected: 0
    description: ''
  closeout_amp4:
    schema_version: 1
    steps:
    - do: set
      device: U_148_PLC
      variable: DO.Ch9
      value: 'off'
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: check
      device: U_148_PLC
      variable: DI.Ch17
      expected: 'off'
    description: ''
  closeout_dump_gaia:
    schema_version: 1
    steps:
    - do: run
      plan: close_gaia_internal_shutters
    - do: run
      plan: insert_gaia_stops
    - do: run
      plan: closeout_amp4
    description: ''
  closeout_pmq_REMOVE:
    schema_version: 1
    steps:
    - do: set
      device: U_Hexapod
      variable: ypos
      value: -22
      wait_for_execution: true
    description: ''
  dump_gaia_on_stops:
    schema_version: 1
    steps:
    - do: run
      plan: close_gaia_internal_shutters
    - do: run
      plan: insert_gaia_stops
    - do: run
      plan: open_gaia_internal_shutters
    description: ''
  experiment_CLOSEOUT:
    schema_version: 1
    steps:
    - do: run
      plan: closeout_dump_gaia
    - do: run
      plan: zero_steering_magnets
    - do: run
      plan: zero_visa_magnets
    - do: run
      plan: zero_emq_magnets
    - do: run
      plan: zero_pressure_voltage
    - do: run
      plan: zero_chicane_magnets
    - do: run
      plan: closeout_pmq_REMOVE
    - do: run
      plan: zero_magspec_currents
    description: ''
  insert_gaia_stops:
    schema_version: 1
    steps:
    - do: set
      device: U_148_PLC
      variable: DO.Ch1
      value: 'on'
      wait_for_execution: true
    - do: wait
      seconds: 0.5
    - do: set
      device: U_148_PLC
      variable: DO.Ch2
      value: 'on'
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: check
      device: U_148_PLC
      variable: DI.Ch1
      expected: 'on'
    - do: wait
      seconds: 0.5
    - do: check
      device: U_148_PLC
      variable: DI.Ch3
      expected: 'on'
    description: ''
  open_gaia_internal_shutters:
    schema_version: 1
    steps:
    - do: set
      device: U_GaiaSVEReader
      variable: InternalShutterA
      value: 1
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: set
      device: U_GaiaSVEReader
      variable: InternalShutterB
      value: 1
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: check
      device: U_GaiaSVEReader
      variable: InternalShutterA
      expected: 1
    - do: wait
      seconds: 3.0
    - do: check
      device: U_GaiaSVEReader
      variable: InternalShutterB
      expected: 1
    description: ''
  pmq_INSERT:
    schema_version: 1
    steps:
    - do: run
      plan: Amp4_DUMP_HP
    - do: set
      device: U_Hexapod
      variable: ypos
      value: 17.95
      wait_for_execution: true
    - do: run
      plan: Amp4_SEND_HP_TO_TARGET
    description: ''
  pmq_REMOVE:
    schema_version: 1
    steps:
    - do: run
      plan: Amp4_DUMP_HP
    - do: set
      device: U_Hexapod
      variable: ypos
      value: -22
      wait_for_execution: true
    description: ''
  s1h_exercise:
    schema_version: 1
    steps:
    - do: set
      device: U_S1H
      variable: Current
      value: 1.0
      wait_for_execution: true
    - do: wait
      seconds: 3.0
    - do: set
      device: U_S1H
      variable: Current
      value: 0.0
      wait_for_execution: true
    description: ''
  remove_gaia_stops:
    schema_version: 1
    steps:
    - do: set
      device: U_148_PLC
      variable: DO.Ch1
      value: 'off'
      wait_for_execution: true
    - do: wait
      seconds: 0.5
    - do: set
      device: U_148_PLC
      variable: DO.Ch2
      value: 'off'
      wait_for_execution: true
    - do: wait
      seconds: 1.0
    - do: check
      device: U_148_PLC
      variable: DI.Ch2
      expected: 'on'
    - do: wait
      seconds: 0.5
    - do: check
      device: U_148_PLC
      variable: DI.Ch4
      expected: 'on'
    description: ''
  remove_visa_plungers:
    schema_version: 1
