      wait_for_execution: true
    - do: set
      device: U_VisaPlungers
      variable: DigitalOutput.Channel 7
      value: 'off'
      wait_for_execution: true
    - do: set
      device: U_VisaPlungers
      variable: DigitalOutput.Channel 7
      value: 'off'
      wait_for_execution: true
    - do: set
