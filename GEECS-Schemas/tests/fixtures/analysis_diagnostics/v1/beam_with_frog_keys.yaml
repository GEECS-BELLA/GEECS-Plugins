# v1 known-bad: a BeamAnalyzer carrying FROG retrieval keys under
# image.analysis. v1 silently ignored them; v2 must refuse.
name: U_FROG_Grenouille
output_name: U_FROG_Beam
image_analyzer: image_analysis.analyzers.beam_analyzer.BeamAnalyzer
image:
  type: camera
  bit_depth: 16
  analysis: {delt: 0.85, dellam: -0.085, lam0: 400.0, N: 512}
  pipeline: {steps: []}
scan: {priority: 1, mode: per_shot, save: true}
