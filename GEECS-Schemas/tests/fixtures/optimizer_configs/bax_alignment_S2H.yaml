schema_version: 1
vocs:
  variables:
    U_S2H:Current:
    - -2.0
    - 2.0
    U_EMQTripletBipolar:Current_Limit.Ch2:
    - -0.85
    - -0.55
  observables: &id001
  - aline.x_CoM
measurements:
  aline:
    diagnostic: UC_ALineEBeam3
    frames: per_bin
generator:
  name: multipoint_bax_alignment_l2
  options:
    control_names:
    - U_S2H:Current
    measurement_name: U_EMQTripletBipolar:Current_Limit.Ch2
    observable_names: *id001
    probe_nominal: -0.7
    probe_grid_absolute:
    - -0.1
    - 0.0
    - 0.1
    n_control_mesh: 21
    mesh_measurement: true
    n_measurement_mesh: 5
    n_monte_carlo_samples: 32
    use_low_noise_prior: false
run:
  on_finish: best
  shots_per_step: 5
  max_iterations: 30
